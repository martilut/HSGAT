[tool.poetry]
name = "hsgat"
version = "0.1.0"
description = "Heterogeneous Sparse Graph Attention with GraphGym workflow"
authors = ["martilut"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
torch = "2.6.0"
torchvision = "0.21.0"
torchaudio = "2.6.0"
torch-geometric = "2.9.0"
pytorch-lightning = "2.7.0"
yacs = "0.1.8"
protobuf = "5.29.6"
numpy = "1.26.4"
scipy = "1.13.1"
pandas = "2.2.2"
scikit-learn = "1.5.1"
networkx = "3.3"
matplotlib = "3.9.1"
tqdm = "4.66.4"
aiohttp = "3.13.3"
fsspec = "2024.6.1"
jinja2 = "3.1.4"
psutil = "6.0.0"
pyparsing = "3.1.2"
requests = "2.32.3"
xxhash = "3.4.1"
tensorboard = "2.17.1"
PyYAML = "6.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
