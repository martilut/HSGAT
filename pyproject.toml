[tool.poetry]
name = "hsgat"
version = "0.1.0"
description = "Heterogeneous Sparse Graph Attention"
authors = ["martilut"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
rdkit = ">=2025.3.3,<2026.0.0"
torchmetrics = "0.9.1"
ogb = ">=1.3.6,<2.0.0"
tensorboardx = ">=2.6.4,<3.0.0"
yacs = ">=0.1.8,<0.2.0"
networkx = ">=3.5,<4.0"
fastparquet = ">=2024.11.0,<2025.0.0"
torch = {version = "2.8.0+cu128", source = "pytorch"}
torchvision = {version = "0.23.0+cu128", source = "pytorch"}
torchaudio = {version = "2.8.0+cu128", source = "pytorch"}
cugraph-cu12 = "25.8.0"
torch-geometric = "2.6.1"
igraph = ">=0.11.9,<0.12.0"
pyarrow = "<17.0.0"
numpy = ">=1.24,<2.0"
hydra-core = "^1.3.2"
pyg-lib = {url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/pyg_lib-0.4.0%2Bpt28cu128-cp311-cp311-linux_x86_64.whl"}
torch-scatter = {url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/torch_scatter-2.1.2%2Bpt28cu128-cp311-cp311-linux_x86_64.whl"}
torch-sparse = {url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/torch_sparse-0.6.18%2Bpt28cu128-cp311-cp311-linux_x86_64.whl"}
torch-cluster = {url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/torch_cluster-1.6.3%2Bpt28cu128-cp311-cp311-linux_x86_64.whl"}
torch-spline-conv = {url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/torch_spline_conv-1.2.2%2Bpt28cu128-cp311-cp311-linux_x86_64.whl"}
tenacity = "^9.1.2"
setuptools = "80.9.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
