[tool.poetry]
name = "hsgat"
version = "0.1.0"
description = "Heterogeneous Sparse Graph Attention"
authors = ["martilut"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
igraph = "^1.0.0"
pyarrow = "^23.0.1"
hydra-core = "^1.3.2"
tenacity = "^9.1.4"
setuptools = "65.5.0"
tqdm = "^4.67.3"
torch = "2.10.0"
torch-geometric = "^2.7.0"
torch-scatter = "^2.1.2"
torch-sparse = "^0.6.18"
torch-cluster = "^1.6.3"
numba = "^0.65.1"
yacs = "0.1.8"
numpy = "1.26.4"
scipy = "1.13.1"
pandas = "2.2.2"
scikit-learn = "1.5.1"
networkx = "3.3"
matplotlib = "3.9.1"
psutil = "6.0.0"
tensorboard = "2.17.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
